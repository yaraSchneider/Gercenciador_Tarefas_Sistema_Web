<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio Card Responsivo</title>

  <!-- Tailwind CSS via Play CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-50 min-h-screen font-sans antialiased flex items-center justify-center p-4">

  <!-- Card -->
  <div class="max-w-xl bg-white border border-slate-200 rounded-xl shadow-lg p-6">

    <!-- Layout -->
    <div class="flex flex-col md:flex-row items-center gap-6">

      <!-- Avatar -->
        <div class="size-24 rounded-full bg-blue-600 text-white flex items-center justify-center text-3xl font-bold shrink-0">
            JS
       </div>

      <!-- Informações -->
      <div class="text-center md:text-left">
        <span class="text-sm text-slate-500">
          Desenvolvedor Front-end
        </span>

        <h1 class="text-2xl font-bold text-slate-800 mt-1">
          João Silva
        </h1>

        <p class="text-slate-600 mt-3">
          "O segredo de uma interface incrível não está nas cores, mas
          no domínio absoluto do espaçamento e da hierarquia visual."
        </p>

        <button class="mt-4 bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700 transition">
          Ver Perfil
        </button>
      </div>

    </div>

  </div>

</body>
</html>
